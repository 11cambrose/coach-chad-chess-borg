[project]
name = "chadborg"
version = "0.4.0"
description = "Coach Chad Borg: Fly-style 1-ply legal-move ranker (lite /think) and macos alpha-beta search. Legal moves only, CPU only."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Coach Chad / The Chess Zone", email = "coach@coffeefordessert.com" }]
# python-chess is published on PyPI as "chess" (the "python-chess" name is a 1.999 shim)
dependencies = ["chess>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chadborg = "chadborg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
