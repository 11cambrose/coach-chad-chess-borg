[project]
name = "chesszero"
version = "0.2.0"
description = "Coach Chad's Chess Borg — AlphaZero-style RL agent that learns chess from self-play. Hourly Coach vs Borg iterations toward steady rating growth."
authors = [
    { name = "Coach Chad / The Chess Zone", email = "coach@coffeefordessert.com" },
    { name = "Alberto (original ChessZero)", email = "alberto.rfernandez4@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "torch (>=2.0)",
    "python-chess (>=1.11)",
    "numpy (>=1.24)",
]

[project.scripts]
chesszero = "chesszero.cli:main"

[tool.poetry]
packages = [{ include = "chesszero", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
