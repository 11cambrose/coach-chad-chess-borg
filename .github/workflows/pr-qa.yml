# PR checks for chadborg: unit tests + quick QA (book rates, legality, mate assists,
# Fly best_pick/regret on the committed held-out set, short games vs Stockfish 19 depth 1).
name: PR QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  SF_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
  SF_SHA256: 9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f

jobs:
  tests:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (uv)
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.22"
          uv venv .venv --python "${{ matrix.python }}"
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: pytest
        run: .venv/bin/pytest -q

  quick-qa:
    name: quick QA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install (uv)
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.22"
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -e .
      - name: Fetch Stockfish 19 (official release, checksum pinned)
        run: |
          curl -fsSL -o sf.tgz "$SF_URL"
          echo "$SF_SHA256  sf.tgz" | sha256sum -c -
          tar xzf sf.tgz
      - name: chadborg_qa --quick
        run: |
          .venv/bin/python qa/chadborg_qa.py --quick \
            --stockfish "$PWD/stockfish/stockfish-linux-x86-64-universal" --out-dir qa-results
      - name: Summary
        if: always()
        run: |
          if [ -f qa-results/results.csv ]; then
            { echo '### chadborg quick QA'; echo; echo '```'; cat qa-results/results.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: chadborg-quick-qa
          path: qa-results/
          retention-days: 14
