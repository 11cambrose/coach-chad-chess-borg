# Coach Chad Borg: scheduled RL iteration on the CPU stack (chadborg, python-chess, no torch).
#   install -> pytest -> short macos self-play (rl labels) -> QA metrics -> ratings/history.json
#
# This workflow is DISABLED on GitHub (paused by Chad on 2026-10-06). Editing this file does
# not re-enable it. Re-enable from the Actions tab only when you want the schedule back.
# Results are uploaded as an artifact; nothing is committed back to the repo.

name: Coach Chad RL Iteration

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      games:
        description: 'Self-play games (macos profile)'
        required: false
        default: '2'
      depth:
        description: 'macos search depth for self-play (1-3; 3 is ~10 s/move)'
        required: false
        default: '2'
      qa_mode:
        description: 'QA mode: quick or full'
        required: false
        default: 'quick'

permissions:
  contents: read

concurrency:
  group: rl-iteration
  cancel-in-progress: false

env:
  SF_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
  SF_SHA256: 9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f

jobs:
  rl-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install (uv venv, editable + dev)
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.22"
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Tests
        run: pytest -q

      - name: Short RL run (macos self-play -> ratings/rl_buffer.jsonl)
        env:
          GAMES: ${{ github.event.inputs.games || '2' }}
          DEPTH: ${{ github.event.inputs.depth || '2' }}
        run: |
          chadborg rl --profile macos --games "$GAMES" --depth "$DEPTH" \
            --seed "${GITHUB_RUN_NUMBER}" --out ratings/rl_buffer.jsonl

      - name: Fetch Stockfish 19 (official release, checksum pinned)
        run: |
          curl -fsSL -o sf.tgz "$SF_URL"
          echo "$SF_SHA256  sf.tgz" | sha256sum -c -
          tar xzf sf.tgz
          echo "STOCKFISH=$PWD/stockfish/stockfish-linux-x86-64-universal" >> "$GITHUB_ENV"

      - name: QA metrics -> ratings/history.json
        env:
          QA_MODE: ${{ github.event.inputs.qa_mode || 'quick' }}
        run: |
          python qa/chadborg_qa.py "--${QA_MODE}" --stockfish "$STOCKFISH" \
            --out-dir qa-results --history ratings/history.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chadborg-rl-${{ github.run_number }}
          path: |
            ratings/
            qa-results/
          retention-days: 30
